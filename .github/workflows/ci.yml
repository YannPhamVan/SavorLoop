name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Target environment for manual deployment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - development

permissions:
  contents: read

jobs:
  verify:
    name: "CI : Tests & Build"
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Verify backend and frontend
        run: uv run python scripts/verify.py

  deploy-dev:
    name: "CD : Automated Dev Deploy"
    needs: [verify]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Trigger Render Dev Deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_DEV }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_DEV secret is not configured. Please add it to repository secrets to enable automated deployment."
          else
            echo "Triggering automated deploy to development environment..."
            curl -sS -X POST "$RENDER_DEPLOY_HOOK"
            echo "Dev deploy hook triggered successfully."
          fi

  deploy-production:
    name: "CD : Manual Production Deploy"
    needs: [verify]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target_environment == 'production'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Render Production Deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_PROD }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_PROD secret is not configured. Please add it to repository secrets to enable manual production deployment."
          else
            echo "Triggering manual deployment to production environment..."
            curl -sS -X POST "$RENDER_DEPLOY_HOOK"
            echo "Production deploy hook triggered successfully."
          fi
