services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: sqlite:////data/savorloop.db
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      SAVORLOOP_INVENTORY_INTERPRETER: ${SAVORLOOP_INVENTORY_INTERPRETER:-}
      SAVORLOOP_ENVIRONMENT: ${SAVORLOOP_ENVIRONMENT:-local}
      SAVORLOOP_VERSION: ${SAVORLOOP_VERSION:-local}
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8080:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - database:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_OTEL_EXPORTER_OTLP_ENDPOINT: ${VITE_OTEL_EXPORTER_OTLP_ENDPOINT:-}
        VITE_SAVORLOOP_ENVIRONMENT: ${SAVORLOOP_ENVIRONMENT:-local}
        VITE_SAVORLOOP_VERSION: ${SAVORLOOP_VERSION:-local}
    network_mode: service:backend
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  database:
    name: savorloop-sqlite-data
